<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DACH Robotics Tender Intelligence</title><style>
:root{font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;color:#e8eef7;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:34px max(20px,calc((100vw - 1200px)/2));background:linear-gradient(120deg,#111f39,#18365b)}h1{margin:0 0 10px;font-size:clamp(25px,4vw,40px)}p{color:#a9b9cc}main{max-width:1200px;margin:auto;padding:24px 20px}.eyebrow{letter-spacing:3px;color:#68d3ff;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat,.card,.panel{background:#142138;border:1px solid #29405d;border-radius:15px;padding:19px}.stat strong{display:block;font-size:29px;margin-top:9px}.stat span,.meta{color:#a8bdd2;font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,button{background:#142138;color:#e8eef7;border:1px solid #385474;border-radius:9px;padding:12px;font:inherit}input{flex:1;min-width:190px}button{cursor:pointer}button:hover,a:hover{opacity:.8}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card h3{margin:13px 0 8px;font-size:20px}.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#263d59;border-radius:7px;padding:5px 9px;font-size:12px}.p1{background:#194e3c;color:#9ff5cc}.p2{background:#534122;color:#f8d897}.p3{background:#3d4054;color:#c7cce4}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.kv span{font-size:12px;color:#9db1c8;display:block}.kv b{font-size:14px;overflow-wrap:anywhere}a{color:#79d6ff}.desc{font-size:14px;line-height:1.6;white-space:pre-wrap}.notice{border-left:4px solid #e5bd6b;padding:10px 15px;background:#2d2a28;margin:18px 0;color:#f3dbad}.footer{margin:40px 0;color:#9db1c8;font-size:13px}#empty{display:none;text-align:center;padding:40px}.loading{color:#b4c9db}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr}}</style></head><body>
<header><div class="eyebrow">DACH · ROBOTICS · PROCUREMENT</div><h1>Robotics Tender Intelligence</h1><p>德国 · 奥地利 · 瑞士｜机器人招标监控与产品匹配</p></header><main><div class="notice" id="sourceNote">正在读取采集状态……</div><section class="stats"><div class="stat"><span>收录项目</span><strong id="total">—</strong></div><div class="stat"><span>P1 高匹配</span><strong id="p1">—</strong></div><div class="stat"><span>30 天内截止</span><strong id="due">—</strong></div><div class="stat"><span>最后同步</span><strong id="sync" style="font-size:16px">—</strong></div></section><div class="controls"><input id="search" placeholder="搜索项目、采购机构、技术要求"><select id="country"><option value="">所有国家</option><option value="DE">德国</option><option value="AT">奥地利</option><option value="CH">瑞士</option></select><select id="priority"><option value="">全部优先级</option><option>P1</option><option>P2</option><option>P3</option></select><button id="export">导出 CSV</button></div><section id="cards" class="cards"></section><div id="empty" class="panel">暂无符合条件的招标。当前查询未发现符合条件且仍在投标期内的公告。</div><div class="footer">公开看板仅包含公开采购数据。匹配分数是关键词初筛，不代表满足招标资格或技术规格。请以官方公告及附件为准。</div></main><script>
let tenders=[];const $=id=>document.getElementById(id);function safe(v){return String(v??'未公布').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function country(c){return ({DE:'德国',AT:'奥地利',CH:'瑞士'})[c]||c||'未确认'}function validUrl(u){try{const x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:null}catch{return null}}function render(){const q=$('search').value.toLowerCase(),c=$('country').value,p=$('priority').value;const list=tenders.filter(x=>(!c||x.country===c)&&(!p||x.priority===p)&&JSON.stringify([x.title,x.buyer,x.description]).toLowerCase().includes(q));$('cards').innerHTML=list.map(x=>{const link=validUrl(x.source_url);return `<article class="card"><div class="badges"><span class="badge ${safe((x.priority||'').toLowerCase())}">${safe(x.priority)}</span><span class="badge">${safe(country(x.country))}</span><span class="badge">${safe(x.verification_status)}</span></div><h3>${safe(x.title)}</h3><p class="meta">${safe(x.buyer)}</p><div class="kv"><div><span>匹配评分（初筛）</span><b>${safe(x.match_score)}/100</b></div><div><span>投标截止</span><b>${safe(x.deadline)}</b></div><div><span>预算</span><b>${safe(x.budget_amount)} ${safe(x.budget_currency||'')}</b></div><div><span>匹配产品</span><b>${safe((x.matched_products||[]).join('、')||'待分析')}</b></div></div><p class="meta">发布日期：${safe(x.publication_date)} · 采集：${safe(x.collected_at)}</p><p class="desc">${safe((x.match_reasons||[]).join("；"))}</p><p class="desc">${safe((x.description||'').slice(0,360))}</p>${link?`<a href="${safe(link)}" target="_blank" rel="noopener noreferrer">查看官方公告 ↗</a>`:''}</article>`}).join('');$('empty').style.display=list.length?'none':'block'}
function csv(){const rows=[['项目','采购机构','国家','截止','优先级','评分','原始链接'],...tenders.map(x=>[x.title,x.buyer,x.country,x.deadline,x.priority,x.match_score,x.source_url])];const str=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+str],{type:'text/csv;charset=utf-8'}));a.download='dach-tenders.csv';a.click();URL.revokeObjectURL(a.href)}
async function init(){try{const [d,s]=await Promise.all([fetch('data/tenders.json?ts='+Date.now()),fetch('data/scan_status.json?ts='+Date.now())]);if(!d.ok||!s.ok)throw Error('HTTP '+d.status+'/'+s.status);const data=await d.json(),status=await s.json();tenders=Array.isArray(data.tenders)?data.tenders:[];$('total').textContent=tenders.length;$('p1').textContent=tenders.filter(x=>x.priority==='P1').length;const now=Date.now();$('due').textContent=tenders.filter(x=>x.deadline&&Number.isFinite(Date.parse(x.deadline))&&Date.parse(x.deadline)>=now&&Date.parse(x.deadline)-now<30*864e5).length;$('sync').textContent=data.updated_at?new Date(data.updated_at).toLocaleString('zh-CN'):'尚未同步';$('sourceNote').textContent=`TED（德国/奥地利）：${status.sources?.TED?.status==='connected'?'已接入':'采集异常，显示上次成功数据'}；瑞士 SIMAP：暂未接入。德国时间每天 08:00 计划运行（自动适应夏令时，Actions 可能延迟）。本次有效 ${status.active_count??'—'} 条。${(status.errors||[]).join('；')}`;render()}catch(e){$('sourceNote').textContent='数据读取失败：'+e.message+'。请通过 GitHub Pages 或本地 HTTP 服务打开，不要直接双击 HTML。';$('empty').style.display='block'}}['search','country','priority'].forEach(x=>$(x).addEventListener(x==='search'?'input':'change',render));$('export').addEventListener('click',csv);init();
</script></body></html>
