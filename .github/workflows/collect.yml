name: Collect public tenders
on:
  push:
    branches: [main]
    paths: ['collector/**', 'tests/**', '.github/workflows/collect.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 6,12,18 * * *'
      timezone: 'Europe/Berlin'
permissions:
  contents: write
concurrency:
  group: collect-tenders
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Run collection
        run: python -m collector.fetch
      - name: Commit updated public data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public tender data"
            git push
          fi
